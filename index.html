<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>付款</title>
<style>
  :root{
    --green:#07C160; --green-press:#06AD56; --green-off:#9EE2BD;
    --bg:#EDEDED; --text:#111; --sub:#6B6B6B; --line:#E5E5E5;
    --key:#FFFFFF; --key-press:#D9D9D9; --pad:#F2F2F2; --red:#E64340; --price:#FA5151;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
       background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column}
  .hidden{display:none !important}

  /* 상단 바 */
  .bar{height:48px;display:flex;align-items:center;justify-content:center;position:relative;font-size:17px;font-weight:600;flex:none}
  .bar .back{position:absolute;left:4px;top:0;width:44px;height:48px;display:flex;align-items:center;justify-content:center}
  .tag{font-size:11px;color:#8A8A8A;text-align:center;margin-top:-6px;letter-spacing:.5px;flex:none}

  /* 상점 */
  .merchant{display:flex;align-items:center;gap:12px;padding:20px 24px 16px;flex:none}
  .logo{width:46px;height:46px;border-radius:50%;background:#fff;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  .logo img{width:100%;height:100%;display:block}
  .merchant .name{font-size:17px;font-weight:600}
  .merchant .desc{font-size:13px;color:var(--sub);margin-top:2px}

  /* ⓪ 상품 선택 */
  #shop{overflow:hidden}
  .goods{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(16px + env(safe-area-inset-bottom));
         display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
  .good{background:#fff;border-radius:12px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
  .good:active{background:#F5F5F5}
  .good .pic{aspect-ratio:1/1;background:#F7F7F7;display:flex;align-items:center;justify-content:center}
  .good .pic svg,.good .pic img{width:78%;height:78%;object-fit:contain}
  .good .zh{font-size:16px;font-weight:600;padding:10px 12px 2px;line-height:1.35}
  .good .pr{padding:2px 12px 12px;color:var(--price);font-weight:600;font-size:20px}
  .good .pr small{font-size:13px;margin-right:1px}
  .good .pr span{font-size:12px;color:#9A9A9A;font-weight:400;margin-left:6px}

  .state{grid-column:1/-1;text-align:center;color:var(--sub);font-size:15px;padding:48px 0;line-height:2}
  .state button{color:var(--green);font-weight:600;font-size:15px;padding:8px 16px}

  /* ① 금액 입력 */
  .picked{display:flex;align-items:center;gap:10px;margin:0 24px 14px;padding:8px 10px;background:#fff;border-radius:10px;flex:none}
  .picked .th{width:40px;height:40px;border-radius:6px;background:#F7F7F7;display:flex;align-items:center;justify-content:center;flex:none}
  .picked .th svg,.picked .th img{width:34px;height:34px;object-fit:contain}
  .picked .t1{font-size:15px;font-weight:600}
  .picked .t2{font-size:12px;color:var(--sub);margin-top:1px}
  .picked .chg{margin-left:auto;font-size:13px;color:#576B95;padding:8px 4px}
  .card{background:#fff;border-radius:12px 12px 0 0;flex:1;padding:22px 24px 0;display:flex;flex-direction:column}
  .card .label{font-size:15px;color:var(--text)}
  .amt-row{display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line);padding:12px 0 12px;min-height:74px}
  .amt-row .yen{font-size:32px;font-weight:600;line-height:48px}
  .amt-row .val{font-size:46px;font-weight:600;line-height:52px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .cursor{width:2px;height:42px;background:var(--green);margin-bottom:6px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .note{font-size:14px;color:#576B95;margin-top:14px}
  .hint{font-size:13px;color:var(--red);margin-top:8px;min-height:18px}

  /* 키패드 */
  .pad{background:var(--pad);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));flex:none}
  .pad button{background:var(--key);border-radius:6px;height:54px;font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
  .pad button:active{background:var(--key-press)}
  .pad .zero{grid-column:span 2}
  .pad .pay{grid-column:4;grid-row:2 / span 3;height:auto;background:var(--green);color:#fff;font-size:18px;font-weight:600}
  .pad .pay:active{background:var(--green-press)}
  .pad .pay:disabled{background:var(--green-off)}

  /* ② 비밀번호 시트 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
  .mask.show{opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;height:50%;min-height:410px;background:#fff;border-radius:12px 12px 0 0;
         display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease-out}
  .sheet.show{transform:none}
  .sheet .head{height:50px;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600}
  .sheet .close{position:absolute;left:6px;top:3px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .sheet .info{text-align:center;padding:2px 0 10px}
  .sheet .to{font-size:14px;color:var(--sub)}
  .sheet .big{font-size:34px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .sheet .big small{font-size:22px;margin-right:2px}
  .method{display:flex;justify-content:space-between;align-items:center;margin:0 24px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
  .method b{font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px}
  .boxes{display:flex;justify-content:center;margin:12px 0 0}
  .boxes span{width:52px;height:52px;border:1px solid #D6D6D6;display:flex;align-items:center;justify-content:center;margin-left:-1px}
  .boxes span:first-child{border-radius:6px 0 0 6px;margin-left:0}
  .boxes span:last-child{border-radius:0 6px 6px 0}
  .boxes span.on::after{content:"";width:12px;height:12px;border-radius:50%;background:#111}
  .boxes.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pinpad{margin-top:auto;background:var(--pad);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .pinpad button{background:#fff;border-radius:6px;height:46px;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center}
  .pinpad button:active{background:var(--key-press)}
  .pinpad .blank{background:transparent;pointer-events:none}
  .pinpad .del{background:transparent}

  /* ③ 로딩 */
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
  .loading .box{background:rgba(17,17,17,.92);color:#fff;border-radius:12px;width:156px;padding:26px 12px 20px;text-align:center}
  .spin{width:40px;height:40px;margin:0 auto 14px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading .t1{font-size:16px}
  .loading .t2{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px;line-height:1.5}

  /* 오류 대화상자 */
  .dialog-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:0 40px}
  .dialog{background:#fff;border-radius:12px;width:100%;max-width:300px;overflow:hidden;text-align:center}
  .dialog .msg{padding:32px 24px 28px;font-size:17px;line-height:1.5}
  .dialog .msg p{font-size:14px;color:var(--sub);margin-top:6px}
  .dialog .btns{display:flex;border-top:1px solid var(--line)}
  .dialog .btns button{flex:1;height:52px;font-size:17px;font-weight:600}
  .dialog .btns button+button{border-left:1px solid var(--line)}
  .dialog .ok{color:var(--green)}
  .dialog .alt{color:#576B95}

  /* ④ 결제 완료 */
  #done{background:#fff}
  .done-top{text-align:center;padding:30px 24px 22px}
  .check{width:64px;height:64px;border-radius:50%;background:var(--green);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  .done-top h1{font-size:20px;font-weight:600;color:#068A45}
  .done-top .amt{font-size:44px;font-weight:600;margin-top:12px;font-variant-numeric:tabular-nums}
  .done-top .amt small{font-size:26px;margin-right:2px}
  .rows{margin:0 24px;border-top:1px solid var(--line);padding-top:8px}
  .rows div{display:flex;justify-content:space-between;font-size:14px;padding:8px 0}
  .rows span{color:var(--sub)}
  .rows b{font-weight:400;text-align:right;max-width:62%;word-break:break-all}
  .done-btn{margin:auto auto calc(32px + env(safe-area-inset-bottom));width:180px;height:44px;border-radius:8px;background:#F2F2F2;color:#068A45;font-size:17px;font-weight:600;flex:none}
  .done-btn:active{background:#E3E3E3}
</style>
</head>

      <button data-k="del" class="del" aria-label="删除"><svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round"><path d="M9 2h18a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H9L1 11l8-9Z"/><path d="m14 7 8 8M22 7l-8 8"/></svg></button>
    </div>
  </div>
</div>

<!-- ③ 로딩 -->
<div id="loading" class="loading hidden" role="status">
  <div class="box"><div class="spin"></div><div class="t1">支付中</div><div class="t2">正在安全传输<br>支付信息…</div></div>
</div>

<!-- 오류 -->
<div id="dialog" class="dialog-wrap hidden" role="alertdialog">
  <div class="dialog">
    <div class="msg" id="dlgMsg">支付密码错误，请重试</div>
    <div class="btns"><button class="alt" id="dlgAlt">忘记密码</button><button class="ok" id="dlgOk">重试</button></div>
  </div>
</div>

<!-- ④ 결제 완료 -->
<section id="done" class="screen hidden">
  <div class="bar">支付成功</div>
  <div class="tag">教学模拟 · 非真实支付</div>
  <div class="done-top">
    <div class="check"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 17.5 6.5 6.5L27 10.5"/></svg></div>
    <h1>支付成功</h1>
    <div class="amt"><small>¥</small><span id="doneAmt">0.00</span></div>
  </div>
  <div class="rows">
    <div><span>收款方</span><b><span class="store-name"></span></b></div>
    <div><span>商品</span><b id="doneGood"></b></div>
    <div><span>支付时间</span><b id="doneTime"></b></div>
    <div><span>支付方式</span><b>零钱</b></div>
    <div><span>付款学号</span><b id="doneId"></b></div>
    <div><span>交易单号</span><b id="doneNo"></b></div>
  </div>
  <button class="done-btn" id="doneBtn">完成</button>
</section>

<script>
(function(){
  // ★ 여기에 앱스 스크립트 웹 앱 URL(…/exec)을 붙여넣으세요 ★
  var API_URL = 'https://script.google.com/macros/s/AKfycbxWFOmjmJ1HT8bK38EM6EIUnpEZBD3RffwoPnFDQ_TXOI258mwlkaIDfr4UJZnDtjCj4g/exec';

  // 기본 상점 이름·상품 (페이지가 바로 뜨도록 미리 넣어 둔 값 — Code.gs 와 같게 유지하면 좋아요)
  var STORE_NAME = '平泽迈斯特高中';
  var PRODUCTS = [
    { id: 'wafer', zh: '巧克力威化饼', price: 15, img: '' },
    { id: 'abc',   zh: 'ABC巧克力',   price: 12, img: '' },
    { id: 'grape', zh: '青葡萄味硬糖', price: 8,  img: '' },
    { id: 'soft',  zh: '水果味软糖',   price: 5,  img: '' }
  ];
  var MIN_LOADING = 3000;

  // 기본 상품 그림 (Code.gs 에서 img 주소를 넣으면 그 사진이 대신 나옵니다)
  var ART = {
    wafer: '<svg viewBox="0 0 120 120"><g transform="rotate(-12 60 60)"><rect x="16" y="40" width="88" height="44" rx="5" fill="#E9BF7F"/><rect x="16" y="52" width="88" height="6" fill="#7A4521"/><rect x="16" y="66" width="88" height="6" fill="#7A4521"/><rect x="16" y="40" width="88" height="12" rx="5" fill="#F2D29C"/><path d="M28 40v12M40 40v12M52 40v12M64 40v12M76 40v12M88 40v12" stroke="#D9A45E" stroke-width="2"/><rect x="16" y="76" width="88" height="8" rx="3" fill="#5C3317"/></g></svg>',
    abc: '<svg viewBox="0 0 120 120"><rect x="22" y="26" width="76" height="68" rx="6" fill="#5C3317"/><g fill="#7A4521"><rect x="28" y="32" width="20" height="17" rx="3"/><rect x="50" y="32" width="20" height="17" rx="3"/><rect x="72" y="32" width="20" height="17" rx="3"/><rect x="28" y="51.5" width="20" height="17" rx="3"/><rect x="50" y="51.5" width="20" height="17" rx="3"/><rect x="72" y="51.5" width="20" height="17" rx="3"/><rect x="28" y="71" width="20" height="17" rx="3"/><rect x="50" y="71" width="20" height="17" rx="3"/><rect x="72" y="71" width="20" height="17" rx="3"/></g><path d="M64 94 98 60v34Z" fill="#C9CED6"/><path d="M64 94 98 60" stroke="#A9B0BA" stroke-width="2"/></svg>',
    grape: '<svg viewBox="0 0 120 120"><path d="M38 60 14 42v36Z" fill="#B7E07A"/><path d="M82 60l24-18v36Z" fill="#B7E07A"/><ellipse cx="60" cy="60" rx="26" ry="22" fill="#7CC243"/><ellipse cx="52" cy="52" rx="8" ry="5" fill="#B5E58A"/><g fill="#4F8F22"><circle cx="56" cy="64" r="5"/><circle cx="66" cy="64" r="5"/><circle cx="61" cy="72" r="5"/><circle cx="71" cy="72" r="4"/></g><path d="M63 58c2-4 6-6 9-6" stroke="#4F8F22" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    soft: '<svg viewBox="0 0 120 120"><rect x="14" y="56" width="34" height="30" rx="8" fill="#FF8FA3"/><rect x="44" y="34" width="34" height="30" rx="8" fill="#FFB547"/><rect x="72" y="58" width="34" height="30" rx="8" fill="#FFE066"/><rect x="40" y="68" width="34" height="28" rx="8" fill="#9BDB6E"/><g fill="#fff" opacity=".8"><circle cx="24" cy="64" r="2"/><circle cx="54" cy="42" r="2"/><circle cx="84" cy="66" r="2"/><circle cx="50" cy="76" r="2"/><circle cx="66" cy="44" r="1.6"/><circle cx="96" cy="74" r="1.6"/></g></svg>'
  };

  var good = null, amt = '', pin = '', busy = false;
  var $ = function(id){ return document.getElementById(id); };

  function picHtml(p){
    if (p.img) { var i = document.createElement('img'); i.src = p.img; i.alt = ''; return i.outerHTML; }
    return ART[p.id] || '';
  }

  // ── ⓪ 상품 목록 ──
  function renderGoods(){
  $('goods').textContent = '';
  PRODUCTS.forEach(function(p){
    var b = document.createElement('button');
    b.className = 'good';
    b.innerHTML = '<div class="pic">' + picHtml(p) + '</div><div class="zh"></div><div class="pr"><small>¥</small>' + p.price + '</div>';
    b.querySelector('.zh').textContent = p.zh;
    b.addEventListener('click', function(){ pickGood(p); });
    $('goods').appendChild(b);
  });
  }

  // 서버와 통신 (로그인 정보 없이 보내므로 구글 계정 상태와 무관)
  function api(method, payload){
    var opt = { method: method, redirect: 'follow', credentials: 'omit' };
    var url = API_URL;
    if (method === 'GET') url += '?action=config&t=' + Date.now();
    else { opt.body = JSON.stringify(payload); opt.headers = { 'Content-Type': 'text/plain;charset=utf-8' }; }
    return fetch(url, opt).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function setStoreName(n){
    Array.prototype.forEach.call(document.querySelectorAll('.store-name'), function(el){ el.textContent = n; });
  }

  // 화면은 기본 목록으로 바로 보여 주고, 서버 설정은 뒤에서 받아 와 바뀐 점만 반영합니다.
  // (이 요청이 서버를 미리 깨워 두어서, 결제할 때 응답도 빨라집니다)
  function loadConfig(){
    setStoreName(STORE_NAME);
    renderGoods();
    api('GET').then(function(cfg){
      var next = cfg.products || [];
      if (cfg.storeName && cfg.storeName !== STORE_NAME){ STORE_NAME = cfg.storeName; setStoreName(STORE_NAME); }
      if (next.length && JSON.stringify(next) !== JSON.stringify(PRODUCTS)){
        PRODUCTS = next;
        renderGoods();
      }
    }).catch(function(){ /* 기본 목록으로 계속 진행 */ });
  }
  function pickGood(p){
    good = p; amt = ''; renderAmt();
    $('pickedPic').innerHTML = picHtml(p);
    $('pickedName').textContent = p.zh;
    $('pickedPrice').textContent = '原价 ¥' + p.price;
    show('pay');
  }
  function show(id){
    ['shop','pay','done'].forEach(function(s){ $(s).classList.toggle('hidden', s !== id); });
  }
  $('backShop').addEventListener('click', function(){ show('shop'); });
  $('chgGood').addEventListener('click', function(){ show('shop'); });

  // ── ① 금액 입력 ──
  function renderAmt(){
    $('amtVal').textContent = amt;
    $('payBtn').disabled = !(parseFloat(amt) > 0);
  }
  function pressAmt(k){
    $('amtHint').textContent = '';
    if (k === 'del'){ amt = amt.slice(0, -1); return renderAmt(); }
    if (k === '.'){
      if (amt.indexOf('.') !== -1) return;
      amt = (amt === '' ? '0' : amt) + '.';
      return renderAmt();
    }
    var dot = amt.indexOf('.');
    if (dot !== -1 && amt.length - dot > 2) return;   // 소수 둘째 자리까지
    if (dot === -1 && amt.length >= 5) return;        // 정수 최대 5자리
    if (amt === '0') amt = k; else amt += k;
    renderAmt();
  }
  $('amtPad').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if (b) pressAmt(b.getAttribute('data-k'));
  });
  $('payBtn').addEventListener('click', function(){
    var v = parseFloat(amt);
    if (!(v > 0)) return;
    if (v > 99999.99){ $('amtHint').textContent = '金额超出限制'; return; }
    openPin(v.toFixed(2));
  });

  // ── ② 비밀번호 ──
  function openPin(v){
    pin = ''; renderPin();
    $('pinAmt').textContent = v;
    $('pinLayer').classList.remove('hidden');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      $('mask').classList.add('show'); $('sheet').classList.add('show');
    });});
  }
  function closePin(){
    if (busy) return;
    $('mask').classList.remove('show'); $('sheet').classList.remove('show');
    setTimeout(function(){ $('pinLayer').classList.add('hidden'); }, 250);
  }
  function renderPin(){
    var s = $('boxes').children;
    for (var i = 0; i < 4; i++) s[i].classList.toggle('on', i < pin.length);
  }
  function pressPin(k){
    if (busy) return;
    if (k === 'del'){ pin = pin.slice(0, -1); return renderPin(); }
    if (pin.length >= 4) return;
    pin += k; renderPin();
    if (pin.length === 4) setTimeout(submit, 150);
  }
  $('pinPad').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if (b) pressPin(b.getAttribute('data-k'));
  });
  $('pinClose').addEventListener('click', closePin);
  $('mask').addEventListener('click', closePin);

  // ── ③ 전송 ──
  function submit(){
    busy = true;
    var started = Date.now();
    var value = parseFloat(amt).toFixed(2);
    var id = pin;
    $('loading').classList.remove('hidden');
    function after(fn, minMs){ setTimeout(fn, Math.max(0, minMs - (Date.now() - started))); }
    api('POST', { amount: value, pin: id, productId: good ? good.id : '' })
      .then(function(res){
        if (res && res.ok){
          after(function(){ showDone(res, id); }, MIN_LOADING);
        } else {
          after(function(){
            $('loading').classList.add('hidden'); busy = false;
            if (res && res.reason === 'pin') wrongPin();
            else { showDialog('支付失败', '请重新选择商品和金额', null); pin = ''; renderPin(); }
          }, 1200);
        }
      })
      .catch(function(){
        after(function(){
          $('loading').classList.add('hidden'); busy = false;
          showDialog('网络异常，请稍后重试', '', null);
          pin = ''; renderPin();
        }, 1200);
      });
  }

  function wrongPin(){
    var b = $('boxes'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    showDialog('支付密码错误，请重试', '', function(){
      $('dlgMsg').innerHTML = '支付密码为你的学号<p>例：1年级1班5号 → 1105</p>';
      $('dlgAlt').classList.add('hidden');
    });
    pin = ''; renderPin();
  }

  var altFn = null;
  function showDialog(text, sub, onAlt){
    $('dlgMsg').textContent = text;
    if (sub){ var p = document.createElement('p'); p.textContent = sub; $('dlgMsg').appendChild(p); }
    altFn = onAlt;
    $('dlgAlt').classList.toggle('hidden', !onAlt);
    $('dialog').classList.remove('hidden');
  }
  $('dlgOk').addEventListener('click', function(){ $('dialog').classList.add('hidden'); });
  $('dlgAlt').addEventListener('click', function(){ if (altFn) altFn(); });

  // ── ④ 완료 ──
  function showDone(res, id){
    $('doneAmt').textContent = res.amount;
    $('doneGood').textContent = good ? good.zh : '';
    $('doneTime').textContent = res.time;
    $('doneId').textContent = id;
    $('doneNo').textContent = res.tradeNo;
    $('loading').classList.add('hidden');
    $('pinLayer').classList.add('hidden');
    $('mask').classList.remove('show'); $('sheet').classList.remove('show');
    show('done');
    busy = false;
  }
  $('doneBtn').addEventListener('click', function(){
    good = null; amt = ''; pin = ''; renderAmt(); renderPin();
    show('shop');
  });

  renderAmt();
  loadConfig();
})();
</script>
</body>
</html>
